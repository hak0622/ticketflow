global:
  resolve_timeout: 5m

route:
  receiver: slack-payment-compensation
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-payment-compensation
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}
          *상태:* {{ .Status }}
          *설명:* {{ .Annotations.description }}
          *조치:* {{ .Annotations.action }}
          {{ end }}
