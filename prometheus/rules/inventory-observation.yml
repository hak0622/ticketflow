groups:
  - name: inventory-observation
    rules:
      - alert: BookingInventoryIncomplete
        expr: max by (phase) (booking_inventory_incomplete_current{job="blog-concert-app"} and on (job, instance) ((time() - booking_inventory_observation_last_success_timestamp_seconds{job="blog-concert-app"} < 120) and (booking_inventory_observation_last_success_timestamp_seconds{job="blog-concert-app"} > 0)) and on (job, instance) (up{job="blog-concert-app"} == 1)) > 0
        for: 30s
        labels:
          severity: critical
          service: ticketflow
        annotations:
          summary: "Lua 작업의 불완전 진행 기록이 남아 자동 처리가 보류됐습니다"
          description: "{{ $labels.phase }} 기록 {{ $value }}건. 실제 재고 변경 여부를 단정하지 마세요."
          action: "docs/redis-lua-partial-write.md의 운영 확인 절차를 따르세요. 해제는 재고 정합성 검증 완료를 뜻하지 않습니다."
      - alert: BookingInventoryObservationUnavailable
        expr: (up{job="blog-concert-app"} == 0) or (up{job="blog-concert-app"} == 1 unless on (job, instance) ((booking_inventory_observation_last_success_timestamp_seconds{job="blog-concert-app"} > 0) and (time() - booking_inventory_observation_last_success_timestamp_seconds{job="blog-concert-app"} < 120) and on (job, instance) (count by (job, instance) (booking_inventory_incomplete_current{job="blog-concert-app"} == booking_inventory_incomplete_current{job="blog-concert-app"}) == 2))) or absent(up{job="blog-concert-app"})
        for: 60s
        labels:
          severity: critical
          service: ticketflow
        annotations:
          summary: "Lua 진행 상태 감시 불가"
          description: "앱 또는 DB·Redis 관측 결과를 확인할 수 없습니다. 부분 쓰기가 없다는 뜻이 아닙니다."
          action: "앱 scrape, 관측 로그와 DB·Redis 연결을 확인하세요."
